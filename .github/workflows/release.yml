# Modified in zzzpyyy/multica (fork of multica-ai/multica v0.8.1). See MODIFICATIONS.md.
# Fork release: CLI archives (GoReleaser) and macOS desktop installers only.
# Upstream's Docker, Helm and Homebrew jobs are removed; they publish to
# multica-ai's GHCR and tap. Nothing is uploaded before check-public.sh has
# scanned the unpacked artifacts (G7).
name: Release

on:
  push:
    tags:
      - "v*.*.*-fork.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]; then
            echo "::error::Fork release tags must look like vX.Y.Z-fork.N; got '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Fork checks (G7, G8)
        run: |
          bash scripts/fork/check-public.sh HEAD
          bash scripts/fork/check-modified-headers.sh HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Run tests
        run: bash scripts/test-go.sh --race

      - name: Scan Go vulnerabilities
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG != github.ref_name }}
        working-directory: server
        run: go tool govulncheck ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.verify.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Build CLI archives
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish,announce

      - name: Scan CLI archives (G7)
        run: |
          mkdir -p scan/ours scan/base
          cp dist/*.tar.gz dist/*.zip scan/ours/
          gh release download v0.8.1 -R multica-ai/multica -p 'multica-cli-*' -D scan/base || true
          bash scripts/fork/check-public.sh --artifacts scan/ours --baseline-artifacts scan/base

      # Published as a normal (not pre-) release marked latest, so
      # releases/latest — used by the CLI updater, install scripts and the
      # desktop CLI bootstrap — resolves to it (M5–M7).
      - name: Publish release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --latest --notes "Fork of multica-ai/multica. See README.md and MODIFICATIONS.md."
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.zip dist/checksums.txt

  desktop:
    needs: [verify, release]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.verify.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unsigned (Q8): ad-hoc identity so Apple silicon builds can be allowed
      # via "Open Anyway"; no APPLE_TEAM_ID, so package.mjs skips notarization.
      - name: Package macOS installers
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --mac --x64 --arm64 --publish never -c.mac.identity=-

      - name: Scan installers (G7)
        run: |
          mkdir -p scan/ours scan/base
          find apps/desktop/dist -maxdepth 2 \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} scan/ours/ \;
          gh release download v0.8.1 -R multica-ai/multica -p 'multica-desktop-*-mac-*.zip' -D scan/base || true
          bash scripts/fork/check-public.sh --artifacts scan/ours --baseline-artifacts scan/base

      - name: Upload installers
        run: |
          files=$(find apps/desktop/dist -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest*.yml' \))
          gh release upload "$TAG" --clobber $files
